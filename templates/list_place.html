{% block head %}
<meta name="robots" content="noindex, follow" />
<style>
  /* Stay & Dine — CivicNest form design */

  .opt-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 14px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .opt-label::before {
    content: "";
    width: 25px;
    height: 3px;
    border-radius: 9px;
    background: #8fc2ff;
  }

  .opt-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    max-width: 680px;
  }

  .opt {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
    min-width: 0;
    padding: 17px;
    color: #fff;
    text-align: left;
    font: inherit;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.23);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 20, 70, 0.12);
    transition:
      transform 0.2s,
      background 0.2s,
      border-color 0.2s;
  }

  .opt:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.18);
  }

  .opt.on {
    background: rgba(255, 255, 255, 0.23);
    border: 2px solid #fff;
    padding: 16px;
    box-shadow: 0 0 0 3px rgba(143, 194, 255, 0.2);
  }

  .opt:focus-visible {
    outline: 3px solid #a9d0ff;
    outline-offset: 3px;
  }

  .opt .ico {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    margin-bottom: 3px;
    color: var(--blue, #0047ff);
    background: #fff;
    border-radius: 14px;
  }

  .opt .i {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .opt strong {
    font-size: 15px;
    font-weight: 800;
  }

  .opt small {
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
  }

  .where {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 11px 15px;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    font-size: 13px;
  }

  .where a {
    color: #fff;
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .where a:hover {
    color: #b9d8ff;
  }

  /* Form layout */

  .form-wrap {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }

  .form-wrap .card {
    margin-bottom: 18px;
    padding: 24px;
    overflow: hidden;
    color: var(--ink, #071a42);
    background: #fff;
    border: 1px solid var(--line, #dce7f8);
    border-radius: 22px;
    box-shadow: 0 8px 28px rgba(14, 49, 105, 0.055);
  }

  .form-wrap .card > h2 {
    margin: 0;
    color: var(--navy, #001b5e);
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.035em;
  }

  .form-wrap .card > p.muted {
    margin: 6px 0 0;
    color: var(--muted, #405578);
    font-size: 13px;
    line-height: 1.65;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 15px;
    margin-top: 17px;
  }

  .row.two,
  .row.three {
    grid-template-columns: minmax(0, 1fr);
  }

  .form-wrap .f {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    color: var(--ink, #071a42);
    font-size: 13px;
    font-weight: 700;
  }

  .form-wrap .f > span {
    line-height: 1.5;
  }

  .hint {
    color: var(--muted, #405578);
    font-size: 11px;
    font-weight: 500;
  }

  .form-wrap .f input:not([type="checkbox"]):not([type="file"]),
  .form-wrap .f select,
  .form-wrap .f textarea {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 12px 14px;
    color: var(--ink, #071a42);
    background: #f7faff;
    border: 1px solid #d8e3f3;
    border-radius: 12px;
    outline: none;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition:
      border-color 0.2s,
      box-shadow 0.2s,
      background 0.2s;
  }

  .form-wrap .f textarea {
    min-height: 135px;
    resize: vertical;
    line-height: 1.7;
  }

  .form-wrap .f input::placeholder,
  .form-wrap .f textarea::placeholder {
    color: #8796ae;
    font-weight: 400;
  }

  .form-wrap .f input:focus,
  .form-wrap .f select:focus,
  .form-wrap .f textarea:focus {
    background: #fff;
    border-color: var(--blue, #0047ff);
    box-shadow: 0 0 0 3px rgba(0, 71, 255, 0.09);
  }

  .form-wrap .f input[type="file"] {
    width: 100%;
    min-height: 100px;
    padding: 20px 14px;
    color: var(--muted, #405578);
    background: #f5f8ff;
    border: 1.5px dashed #a9c4ed;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
  }

  .form-wrap .f input[type="file"]:focus-visible {
    outline: 3px solid #a9c4ff;
    outline-offset: 2px;
  }

  .form-wrap .check {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    min-height: 42px;
    padding: 12px 14px;
    color: var(--ink, #071a42);
    background: #f5f8ff;
    border: 1px solid #e1e9f6;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.65;
    cursor: pointer;
  }

  .form-wrap .check input {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    accent-color: var(--blue, #0047ff);
  }

  /* Amenity selection */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 16px;
  }

  .chip {
    position: relative;
  }

  .chip input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .chip span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 14px;
    color: var(--muted, #405578);
    background: #f7faff;
    border: 1px solid #d8e3f3;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition:
      background 0.2s,
      color 0.2s,
      border-color 0.2s;
  }

  .chip input:checked + span {
    color: #fff;
    background: var(--blue, #0047ff);
    border-color: var(--blue, #0047ff);
  }

  .chip input:focus-visible + span {
    outline: 3px solid #a9c4ff;
    outline-offset: 3px;
  }

  /* Submit and photo feedback */

  #photoMsg {
    padding: 10px 12px;
    color: var(--muted, #405578);
    background: #f1f6ff;
    border-radius: 10px;
    line-height: 1.6;
  }

  .form-wrap #listForm > button.btn.block {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 8px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 8px 20px rgba(0, 71, 255, 0.17);
    transition:
      transform 0.2s,
      box-shadow 0.2s;
  }

  .form-wrap #listForm > button.btn.block:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 25px rgba(0, 71, 255, 0.23);
  }

  .fine {
    margin: 13px 0 0;
    color: var(--muted, #405578);
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
  }

  [hidden] {
    display: none !important;
  }

  @media (min-width: 700px) {
    .row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .form-wrap .card {
      padding: 28px;
    }
  }

  @media (max-width: 480px) {
    .opt-grid {
      gap: 9px;
    }

    .opt {
      padding: 13px;
      border-radius: 15px;
    }

    .opt.on {
      padding: 12px;
    }

    .opt strong {
      font-size: 13px;
    }

    .opt small {
      font-size: 11px;
    }

    .opt .ico {
      width: 37px;
      height: 37px;
    }

    .form-wrap .card {
      padding: 18px 15px;
      margin-bottom: 14px;
      border-radius: 18px;
    }

    .form-wrap .card > h2 {
      font-size: 17px;
    }

    .chips {
      gap: 7px;
    }

    .chip span {
      min-height: 38px;
      padding: 0 11px;
      font-size: 11px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .opt,
    .form-wrap .f input,
    .form-wrap .f select,
    .form-wrap .f textarea,
    .chip span {
      transition: none;
    }
  }
</style>
{% endblock %}
